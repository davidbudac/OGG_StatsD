# InfluxDB datasource used by "Main Dashboard" (uid must match the dashboard JSON)
apiVersion: 1
datasources:
  - name: influxdb
    uid: bdkbvyvidpvcwc
    type: influxdb
    access: proxy
    url: http://${DOCKER_INFLUXDB_INIT_HOST}:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${DOCKER_INFLUXDB_INIT_ORG}
      defaultBucket: ${DOCKER_INFLUXDB_INIT_BUCKET}
    secureJsonData:
      token: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}

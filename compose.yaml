# This Docker Compose file is for education purpose only and it contains all necessary components 
# to instantiate one Oracle GoldenGate 23 instance and two Oracle Database 23 Free instances

# This yaml file will create 3 docker containers:
#   1- One Oracle Goldengate 23 Hub
#   2- One Oracle Database 23  (Named: West)
#   3- One Oracle Database 23  (Named: East) 

# To connect to goldengate and databases you can go to:
#  GG Microservices: https://localhost:1055  [ user: oggadmin, password: Welcome##123 ]
#  Grafana:          http://localhost:3000   [ user: admin, password: Welcome##123 ]
#  InfluxDB:         http://localhost:8086   [ user: admin, password: Welcome##123 ]
#
#  Database Service West for SQL Developer: localhost:1524/FREEPDB1  [ sys password: Welcome##123 ]
#  Database Service East for SQL Developer: localhost:1525/FREEPDB1  [ sys password: Welcome##123 ]
#
#  Internal ports all all the same: 1521
#  Database Service West for GoldenGate: 172.28.0.102:1521/FREEPDB1  [ oggadmin password: Welcome##123 ]
#  Database Service East for GoldenGate: 172.28.0.103:1521/FREEPDB1  [ oggadmin password: Welcome##123 ]

# Sample HR schema is installed on both databases

services:
# Create GoldenGate HUB Instance
  gg:
    container_name: ogg234demo
    hostname: ogg234demo
    image: container-registry.oracle.com/goldengate/goldengate-oracle-free:23.26.3.0.6
    restart: unless-stopped
    ports:
      - "1055:8443"
    deploy:
      resources:
          limits:
            cpus: '4.0'
            memory: 8192M
          reservations:
            cpus: '4.0'
            memory: 8192M
    env_file:
      - .env
    networks:
      ogg_docker_network_234:
        ipv4_address: ${DOCKER_OGG_WEST_IP}

# Create WEST Side Database 23.3 Free
  databaseW:
    container_name: db233demoW
    hostname: db233demoW
    image: alexlima/oracle-free:23.3-slim-ogg
    ports:
      - "1524:1521"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      start_period: 120s
      retries: 30
    networks:
      ogg_docker_network_234:
        ipv4_address: ${DOCKER_DB_WEST_IP}


# Create EAST Side Database 23.3 Free
  databaseE:
    container_name: db233demoE
    hostname: db233demoE
    image: alexlima/oracle-free:23.3-slim-ogg
    ports:
      - "1525:1521"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      start_period: 120s
      retries: 30
    networks:
      ogg_docker_network_234:
        ipv4_address: ${DOCKER_DB_EAST_IP}
    
# Create Influxdb Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    restart: always
    env_file:
      - .env
    ports:
      - ${DOCKER_INFLUXDB_INIT_PORT}:8086
    volumes:
      - influxdb_data:/var/lib/influxdb2:rw
    networks: 
      ogg_docker_network_234:
        ipv4_address: ${DOCKER_INFLUXDB_IP}

# Create Telegraf 
  telegraf:
    image: telegraf:1.30.2
    container_name: telegraf
    restart: always
    volumes:
      - ${TELEGRAF_CFG_PATH}:/etc/telegraf/telegraf.conf:rw
    env_file:
      - .env
    depends_on:
      - influxdb
    links:
      - influxdb
    ports:
    - '8125:8125/udp'
    networks: 
      ogg_docker_network_234:
        ipv4_address: ${DOCKER_TELEGRAF_IP}

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana-server
    restart: always
    depends_on:
      - influxdb
    env_file:
      - .env
    links:
      - influxdb
    ports:
      - ${GRAFANA_PORT}:3000
    volumes:
      - grafana_data:/var/lib/grafana:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Main Dashboard-1714512160772.json:/etc/grafana/dashboards/main-dashboard.json:ro
    networks: 
      ogg_docker_network_234:
        ipv4_address: ${DOCKER_GRAFANA_IP}

networks:
  ogg_docker_network_234:
    driver: bridge
    ipam:
      config:
      - subnet: 172.28.0.0/16

volumes:
  grafana_data: {}
  influxdb_data: {}

